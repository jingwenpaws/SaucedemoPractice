name: Selenium CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest
      env:
        STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
        STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
        HEADLESS: "true"
      run: |
        pytest --color=yes

    - name: Upload Test Artifacts (Logs & Screenshots)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-session-results
        path: logs/
        retention-days: 7
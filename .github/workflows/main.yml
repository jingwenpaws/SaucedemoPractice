name: Selenium CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version-file: '.python-version'

    - name: Check Python Version
      run: python --version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest
      env:
        STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
        STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      run: |
        pytest --alluredir=./reports/allure-results --clean-alluredir

    - name: Upload Test Artifacts (Logs & Screenshots)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-session-results
        path: logs/
        retention-days: 7

    - name: Get Allure history
      uses: actions/checkout@v3
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: ./reports/allure-results
        allure_history: allure-history

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-history